name: Deploy su Vercel

# Pubblica in produzione a ogni push su main.
# Usa i secret gia' configurati nel repository:
# VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches:
      - main
  # Permette di pubblicare a mano, anche da un branch diverso da main.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa la CLI di Vercel
        run: npm install --global vercel@latest

      - name: Scarica la configurazione del progetto
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pubblica
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Sito pubblicato: $url"
          echo "### Sito pubblicato" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      # L'URL restituito da "vercel deploy" e' quello della singola build ed e'
      # sempre coperto dalla Deployment Protection. Il sito pubblico e' il
      # dominio di produzione: lo chiediamo alle API di Vercel e verifichiamo
      # quello.
      - name: Verifica che il sito sia raggiungibile
        run: |
          dominio=$(curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            | jq -r '.targets.production.alias // [] | map(select(test("vercel\\.app$"))) | sort_by(length) | first // empty')

          if [ -z "$dominio" ]; then
            echo "Non sono riuscito a determinare il dominio di produzione."
            echo "URL della build: ${{ steps.deploy.outputs.url }}"
            exit 1
          fi

          echo "Dominio di produzione: https://$dominio"
          echo "### Sito online" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$dominio" >> "$GITHUB_STEP_SUMMARY"

          echo "dominio=$dominio" >> "$GITHUB_ENV"

          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://$dominio")
            echo "Tentativo $i: HTTP $code"

            if [ "$code" = "200" ]; then
              echo "Il sito risponde correttamente." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # 30x verso l'SSO di Vercel = Deployment Protection attiva:
            # il deploy e' riuscito, ma i visitatori vedono la pagina di login.
            if [ "$code" = "301" ] || [ "$code" = "302" ] || [ "$code" = "307" ] || [ "$code" = "401" ]; then
              destinazione=$(curl -s -o /dev/null -w "%{redirect_url}" "https://$dominio")
              case "$destinazione" in
                *vercel.com*|*sso*)
                  {
                    echo ""
                    echo "**Attenzione: Deployment Protection attiva.**"
                    echo "Il deploy e' riuscito, ma https://$dominio risponde $code e rimanda al login di Vercel,"
                    echo "quindi il sito non e' pubblico e le API rispondono 401."
                    echo "Si disattiva da Vercel: Settings -> Deployment Protection -> Vercel Authentication: Disabled."
                  } >> "$GITHUB_STEP_SUMMARY"
                  echo "Deployment Protection attiva: il sito non e' pubblicamente accessibile."
                  exit 1
                  ;;
              esac
            fi

            sleep 5
          done

          echo "Il sito non ha risposto 200 dopo il deploy."
          exit 1

      # Prova reale dell'API in produzione, in modalita' test: il gateway viene
      # interrogato davvero ma non parte alcun SMS e non si consuma quota.
      - name: Prova l'invio in modalita' test
        run: |
          risposta=$(curl -s -X POST "https://$dominio/api/send" \
            -H "Content-Type: application/json" \
            -d '{"phone":"+15005550006","message":"Verifica automatica del deploy","test":true}')

          echo "Risposta: $risposta"

          if echo "$risposta" | jq -e '.ok == true' > /dev/null; then
            echo "API di invio funzionante (simulazione riuscita)." >> "$GITHUB_STEP_SUMMARY"
          else
            messaggio=$(echo "$risposta" | jq -r '.message // "risposta non interpretabile"')
            {
              echo ""
              echo "**L'API di invio non ha risposto come previsto:** $messaggio"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
